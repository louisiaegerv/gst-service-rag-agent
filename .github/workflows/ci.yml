name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/setup@v2
        with:
          runtime: node@lts
          cache: true
          install: false

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run build
